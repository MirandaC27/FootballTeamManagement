<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matches - littleLIGA</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand" href="/index.html">littleLIGA</a>
  </nav>

  <div class="container mt-4">
    <h2 class="text-center mb-3">Match Management</h2>
    <button id="show-add-form" class="btn btn-success mb-3">Add New Match</button>

    <form id="add-match-form" class="card p-3" style="display:none;">
      <div class="form-group">
        <label>Home Team Name:</label>
        <input type="text" class="form-control" id="homeTeam" required>
      </div>
      <div class="form-group">
        <label>Away Team Name:</label>
        <input type="text" class="form-control" id="awayTeam" required>
      </div>
      <div class="form-group">
        <label>Home Score:</label>
        <input type="number" class="form-control" id="homeScore" value="-1">
      </div>
      <div class="form-group">
        <label>Away Score:</label>
        <input type="number" class="form-control" id="awayScore" value="-1">
      </div>
      <div class="form-group">
        <label>Date:</label>
        <input type="date" class="form-control" id="matchDate" required>
      </div>
      <div class="form-group">
        <label>Location:</label>
        <input type="text" class="form-control" id="matchLocation" required>
      </div>
      <div class="form-group">
        <label>Status:</label>
        <select class="form-control" id="matchStatus">
          <option value="Scheduled">Scheduled</option>
          <option value="In Progress">In Progress</option>
          <option value="Final">Final</option>
          <option value="Delayed">Delayed</option>
          <option value="Cancelled">Cancelled</option>
          <option value="Forfeit">Forfeit</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Add Match</button>
    </form>

    <div id="form-status" class="mt-3 text-center"></div>

    <h3 class="mt-4 text-center">All Matches</h3>
    <table class="table table-striped" id="matches-table">
      <thead>
        <tr>
          <th>Home Team</th>
          <th>Away Team</th>
          <th>Score</th>
          <th>Date</th>
          <th>Location</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="match-list"></tbody>
    </table>
  </div>

 <script>
  document.addEventListener('DOMContentLoaded', loadMatches);

  let editMode = false;
  let editMatchId = null;

  async function loadMatches() {
    const res = await fetch('/getAllMatches');
    const matches = await res.json();
    const list = document.getElementById('match-list');
    list.innerHTML = '';

    matches.forEach(m => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${m.homeTeam}</td>
        <td>${m.awayTeam}</td>
        <td>${m.homeScore >= 0 && m.awayScore >= 0 ? `${m.homeScore} - ${m.awayScore}` : 'N/A'}</td>
        <td>${new Date(m.matchDate).toLocaleDateString()}</td>
        <td>${m.matchLocation}</td>
        <td>${m.matchStatus}</td>
        <td>
          <button class="btn btn-info btn-sm mr-1" onclick="showEditForm('${m._id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteMatch('${m._id}')">Delete</button>
        </td>
      `;
      list.appendChild(row);
    });
  }

  async function deleteMatch(id) {
    await fetch('/deleteMatch/' + id, { method: 'DELETE' });
    loadMatches();
  }

  const addForm = document.getElementById('add-match-form');
  const showAddForm = document.getElementById('show-add-form');
  const formStatus = document.getElementById('form-status');

  showAddForm.addEventListener('click', () => {
    addForm.style.display = addForm.style.display === 'none' ? 'block' : 'none';
    resetFormMode();
  });

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const match = {
      homeTeam: document.getElementById('homeTeam').value,
      awayTeam: document.getElementById('awayTeam').value,
      homeScore: parseInt(document.getElementById('homeScore').value),
      awayScore: parseInt(document.getElementById('awayScore').value),
      matchDate: document.getElementById('matchDate').value,
      matchLocation: document.getElementById('matchLocation').value,
      matchStatus: document.getElementById('matchStatus').value
    };

    let res;
    if (editMode && editMatchId) {
      // Update existing match
      res = await fetch('/updateMatch/' + editMatchId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(match)
      });
    } else {
      // Create new match
      res = await fetch('/createMatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(match)
      });
    }

    if (res.ok) {
      formStatus.innerText = editMode ? 'Match updated successfully!' : 'Match added successfully!';
      addForm.reset();
      resetFormMode();
      loadMatches();
    } else {
      formStatus.innerText = editMode ? 'Failed to update match.' : 'Failed to add match.';
    }
  });

  async function showEditForm(id) {
    const res = await fetch(`/getMatchDetails/${id}`);
    if (!res.ok) {
      alert('Failed to load match details');
      return;
    }

    const match = await res.json();

    // Fill form fields with match data
    document.getElementById('homeTeam').value = match.homeTeam;
    document.getElementById('awayTeam').value = match.awayTeam;
    document.getElementById('homeScore').value = match.homeScore;
    document.getElementById('awayScore').value = match.awayScore;
    document.getElementById('matchDate').value = match.matchDate.split('T')[0];
    document.getElementById('matchLocation').value = match.matchLocation;
    document.getElementById('matchStatus').value = match.matchStatus;

    // Show the form in edit mode
    addForm.style.display = 'block';
    const submitButton = addForm.querySelector('button[type="submit"]');
    submitButton.textContent = 'Update Match';
    submitButton.classList.remove('btn-primary');
    submitButton.classList.add('btn-warning');

    editMode = true;
    editMatchId = id;
  }

  function resetFormMode() {
    const submitButton = addForm.querySelector('button[type="submit"]');
    submitButton.textContent = 'Add Match';
    submitButton.classList.remove('btn-warning');
    submitButton.classList.add('btn-primary');
    editMode = false;
    editMatchId = null;
  }
</script>

</body>
</html>
