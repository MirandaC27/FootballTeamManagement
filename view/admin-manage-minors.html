<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <title>Manage Minors - Soccer League Management</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!--nav bar-->
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <nav class="navbar navbar-dark bg-primary">

            <!--logo-->
            <a class="navbar-brand" href="/index.html">
                <img src="/images/logo placeholder.jpg" width="30" height="30" class="d-inline-block align-top" alt="">
                littleLIGA
            </a>
        </nav>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!--options-->
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-item nav-link active" href="/index.html">Home <span class="sr-only">(current)</span></a>
                <a class="nav-item nav-link" href="#">League</a>
                <a class="nav-item nav-link" href="#">Matches</a>
                <a class="nav-item nav-link" href="#">Team</a>
                <a class="nav-item nav-link" href="#">Calendar</a>
            </div>
        </div>

        <!--sign in button-->
        <div id="signin-btn" class="ms-auto">
            <a class="btn btn-dark btn-rounded" href="/login.html">SIGN IN</a>
        </div>

        <!--account and log out dropdown-->
        <div id="account-dropdown" class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person"
                    viewBox="0 0 16 16">
                    <path
                        d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                </svg> Account
            </button>
            <ul class="dropdown-menu">
                <li id="admin"><a class="dropdown-item" href="/admin.html">Admin</a></li>
                <li><a class="dropdown-item" href="/logout">Log out</a></li>
            </ul>
        </div>
    </nav>

    <!--table of all users-->
    <h1 class="text-center mt-4">Manage Minors</h1>
    <div class="container mt-4">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Parent ID</th>
                    <th scope="col">Team ID</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>

            <tbody id="userTableBody">
            </tbody>
        </table>
    </div>

    <script>
        async function checkLoggedUser() {
            let response = await fetch('/loggedUser');
            let user = await response.json();
            const SIGN_IN_BTN = document.getElementById('signin-btn');
            const ACCOUNT_DROPDOWN = document.getElementById('account-dropdown');

            if (user) {
                SIGN_IN_BTN.style.display = 'none';
                ACCOUNT_DROPDOWN.style.display = 'block';

                // show admin option only if user is an admin
                if (user.role === 'admin') {
                    document.getElementById('admin').style.display = 'block';
                } else {
                    document.getElementById('admin').style.display = 'none';
                }
            } else {
                SIGN_IN_BTN.style.display = 'block';
                ACCOUNT_DROPDOWN.style.display = 'none';
            }
            checkAdminAccess(user);
        }

        /**
         * Block admin.html if user isn't an admin.
         * @param user user object
         */
        function checkAdminAccess(user) {
            if (!user || user.role !== 'admin') {
                window.location.replace('/login.html');
            }
        }
        checkLoggedUser();
    </script>
    <script>
        /**
         * Display a table of all minors from database.
         */
        async function displayMinors() {
            let response = await fetch('/getAllMinors');
            let minors = await response.json();
            let tbody = document.getElementById('userTableBody');

            for (let minor of minors) {
                const tr = createMinorRow(minor);
                tbody.appendChild(tr);
            }
        }

        /**
         * Create a table row for a single minor.
         */
        function createMinorRow(minor) {
            let tr = document.createElement('tr');
            let minorId = document.createElement('td');
            let minorName = document.createElement('td');
            let minorParentId = document.createElement('td');
            let minorTeamId = document.createElement('td');
            let minorReassign = document.createElement('td');

            // Fill each row cell with minor's info
            minorId.appendChild(document.createTextNode(minor._id));
            minorName.appendChild(document.createTextNode(minor.name));
            minorParentId.appendChild(document.createTextNode(minor.parent_id));
            minorTeamId.appendChild(document.createTextNode(minor.team_id ? minor.team_id : '-'));

            // Reassign button for the Action column 
            const reassignBtn = createReassignButton(minor);
            minorReassign.appendChild(reassignBtn);
            tr.appendChild(minorId);
            tr.appendChild(minorName);
            tr.appendChild(minorParentId);
            tr.appendChild(minorTeamId);
            tr.appendChild(minorReassign);
            return tr;
        }

        /**
         * Create a reassign button, which is for the Action column. 
         * @param minorId minor's ID in database
         */
        function createReassignButton(minor) {
            const reassignBtn = document.createElement("button");
            reassignBtn.textContent = "Reassign?";
            reassignBtn.classList.add("btn", "btn-sm", "btn-primary");

            reassignBtn.onclick = async function () {
                const newTeamId = prompt("Enter new team ID:");
                if (newTeamId == null) {
                    return;
                } else {
                    await reassignMinor(minor, newTeamId);
                }
            };
            return reassignBtn;
        }

        /**
         * Reassign minor on database by changing its team ID.
         */
        async function reassignMinor(minor, newTeamId) {
            const response = await fetch(`/reassignMinor/${minor._id}/${newTeamId}`, {method: 'PUT'});
        }
        displayMinors();
    </script>
</body>

</html>
