<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <title>Admin - Manage Playoff Brackets</title>
    <style>
        .bracket-container {
        display: flex;
        overflow-x: auto;
        padding: 20px 10px;
        gap: 40px;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            gap: 40px;
            min-width: 200px;
        }

        .bracket-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .matchup {
            position: relative;
            background: white;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #007bff;
            width: 180px;
        }

        .team {
            padding: 5px 8px;
        }

        .team + .team {
            border-top: 1px solid #ccc;
        }

        /* Lines connecting matchups */
        .matchup::after {
            content: "";
            position: absolute;
            top: 50%;
            right: -40px;
            width: 40px;
            height: 2px;
            background: #0004;
        }

        .bracket-round:last-child .matchup::after {
            display: none; /* no lines after final round */
        }

        .matchup {
            position: relative;
            padding: 15px;
            margin: 10px 0;
            background: #f5f5f5;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .matchup-header {
            position: absolute;
            top: 6px;
            right: 6px;
        }

        .delete-matchup {
            cursor: pointer;
            font-size: 18px;
            color: #b30000;
            transition: 0.2s ease;
        }

        .delete-matchup:hover {
            color: #ff0000;
            transform: scale(1.2);
        }
    </style>
</head>

<body>

        crossorigin="anonymous"></script>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

        <!--sign in button-->
        <div id="signin-btn" class="ms-auto">
            <a class="btn btn-dark btn-rounded" href="/login.html">SIGN IN</a>

        <!--account and log out dropdown-->

                    <path
                        d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                </svg> Account

    <!--Playoff Brackets-->
    <div class="container">
        <h2 class="text-center mb-4">🏆 Manage Playoff Brackets</h2>

        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-body">

                        <!-- Header with Delete Button -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">🏆 Current Bracket</h5>
                            <button class="btn btn-danger btn-sm" id="deleteBracketBtn">
                                🗑️ Delete Bracket
                            </button>
                        </div>

                        <div id="bracketContainer" class="bracket-container">
                            <p class="text-muted">Loading bracket...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Functions for brackets-->
    <script>
        // Load the bracket on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const size = parseInt(params.get('size'));

            if (size) {
                try {
                    const qualifyingTeams = await fetchQualifyingTeams(size); // sorted highest to lowest
                    const currentYear = new Date().getFullYear();
                    const timestamp = Date.now(); // milliseconds since epoch
                    const bracketName = `Bracket_${currentYear}_${timestamp}`;
                    const rounds = generateInitialRounds(qualifyingTeams);

                    const response = await fetch('/createBracket', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: bracketName, numTeams: size, rounds })
                    });

                    if (!response.ok) throw new Error('Failed to create bracket');

                    const bracket = await response.json();
                    window.currentBracket = bracket;
                    displayBracket(bracket);
                } catch (err) {
                    console.error(err);
                    alert('Error generating bracket');
                }
            } else {
                loadBrackets(); // fallback if no size param
            }
        });

        async function fetchQualifyingTeams(size) {
            const res = await fetch('/getAllTeams');
            const teams = await res.json();
            // Sort by rank (highest to lowest)
            teams.sort((a, b) => b.rank - a.rank);
            return teams.slice(0, size).map(t => t.name);
        }

        // Generate initial rounds using seeded teams
        function generateInitialRounds(teams) {
            let rounds = [], roundNumber = 1;
            let currentTeams = [...teams];

            while (currentTeams.length >= 2) {
                let matchups = [];
                while (currentTeams.length > 1) {
                    const home = currentTeams.shift();   // highest rank
                    const away = currentTeams.pop();     // lowest rank
                    matchups.push({ homeTeam: home, awayTeam: away, result: null });
                }
                rounds.push({ roundNumber, roundMatchups: matchups });
                currentTeams = matchups.map(() => 'TBD'); // winners unknown
                roundNumber++;
            }

            return rounds;
        }

        function createTeamField(teamValue, side) {
            if (teamValue === "TBD" || !teamValue) {
                return `
                    <select class="tbd-select" data-side="${side}">
                        <option value="">Select Team</option>
                    </select>
                `;
            }
            return `<div class="team">${teamValue}</div>`;
        }

        // Display bracket in table
        async function displayBracket(bracket) {
            const container = document.getElementById("bracketContainer");
            container.innerHTML = "";

            // Fetch all teams for dropdowns
            const teamsRes = await fetch('/getAllTeams');
            const teams = await teamsRes.json();

            const lastRoundNumber = Math.max(...bracket.rounds.map(r => r.roundNumber));

            bracket.rounds.forEach(round => {
                const roundCol = document.createElement("div");
                roundCol.className = "bracket-round";

                if (round.roundNumber === lastRoundNumber) roundCol.classList.add("championship-round");

                const title = document.createElement("div");
                title.className = "bracket-title";
                title.textContent = round.roundNumber === lastRoundNumber
                    ? "🏆 Championship Round"
                    : `Round ${round.roundNumber}`;
                roundCol.appendChild(title);

                round.roundMatchups.forEach((match, index) => {
                    const box = document.createElement("div");
                    box.className = "matchup";

                    // Function to generate team field (TBD or fixed)
                    const createTeamField = (teamValue, side) => {
                        if (teamValue === "TBD" || !teamValue) {
                            return `
                                <select class="tbd-select" data-round="${round.roundNumber}" data-index="${index}" data-side="${side}">
                                    <option value="">Select Team</option>
                                    ${teams.map(t => `<option value="${t.name}">${t.name}</option>`).join("")}
                                </select>
                            `;
                        }
                        return `<div class="team">${teamValue}</div>`;
                    };

                    box.innerHTML = `
                        <div class="matchup-header">
                            <span class="delete-matchup" data-round="${round.roundNumber}" data-index="${index}">🗑️</span>
                        </div>
                        ${createTeamField(match.homeTeam, "home")}
                        ${createTeamField(match.awayTeam, "away")}
                        <button class="confirm-matchup btn btn-success btn-sm mt-2" style="display:none"
                            data-round="${round.roundNumber}" data-index="${index}">
                            ✅ Confirm Matchup
                        </button>
                    `;

                    roundCol.appendChild(box);
                });

                container.appendChild(roundCol);
            });

            // Re-attach events for dropdowns and confirm buttons
            enableTbdDropdowns();
            deleteMatchup();
        }

        function enableTbdDropdowns() {
            document.querySelectorAll(".tbd-select").forEach(select => {

                select.addEventListener("change", function () {

                    const matchupBox = this.closest(".matchup");
                    const confirmBtn = matchupBox.querySelector(".confirm-matchup");

                    const selects = matchupBox.querySelectorAll(".tbd-select");
                    let homeTeam = "TBD";
                    let awayTeam = "TBD";

                    selects.forEach(sel => {
                        if (sel.dataset.side === "home") homeTeam = sel.value || "TBD";
                        if (sel.dataset.side === "away") awayTeam = sel.value || "TBD";
                    });

                    // Show confirm button only if both are selected
                    if (homeTeam !== "TBD" && awayTeam !== "TBD") {
                        confirmBtn.style.display = "block";
                    } else {
                        confirmBtn.style.display = "none";
                    }
                });
            });

            // Confirm Button Click (database push)
            document.querySelectorAll(".confirm-matchup").forEach(btn => {
                btn.addEventListener("click", async function () {

                    const roundNumber = this.dataset.round;
                    const matchupBox = this.closest(".matchup");

                    const selects = matchupBox.querySelectorAll(".tbd-select");

                    let homeTeam = "TBD";
                    let awayTeam = "TBD";

                    selects.forEach(sel => {
                        if (sel.dataset.side === "home") homeTeam = sel.value;
                        if (sel.dataset.side === "away") awayTeam = sel.value;
                    });

                    const match = {
                        homeTeam,
                        awayTeam,
                        result: null
                    };

                    try {
                        const res = await fetch(`/addMatchup/${window.currentBracket.name}/${roundNumber}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(match)
                        });

                        const updated = await res.json();
                        window.currentBracket = updated;
                        displayBracket(updated);

                    } catch (err) {
                        console.error(err);
                        alert("Failed to update matchup.");
                    }
                });
            });
        }

        // Load existing brackets
        async function loadBrackets() {
            try {
                const res = await fetch('/getAllBrackets');
                const brackets = await res.json();
                if (brackets.length > 0) {
                    window.currentBracket = brackets[0]; // pick first
                    displayBracket(brackets[0]);
                    populateRoundsDropdown(brackets[0]);
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Delete a matchup
        async function deleteMatchup() {
            document.querySelectorAll(".delete-matchup").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const round = btn.dataset.round;
                    const homeTeam = btn.dataset.home;
                    const awayTeam = btn.dataset.away;

                    if (!confirm("Are you sure you want to delete this matchup?")) return;

                    try {
                        const res = await fetch(`/deleteMatchup/${encodeURIComponent(window.currentBracket.name)}/${round}/${encodeURIComponent(homeTeam)}/${encodeURIComponent(awayTeam)}`, {
                            method: "DELETE"
                        });

                        if (!res.ok) throw new Error("Failed to delete matchup.");

                        const updatedBracket = await res.json();
                        window.currentBracket = updatedBracket;
                        displayBracket(updatedBracket);

                    } catch (err) {
                        console.error(err);
                        alert("Error deleting matchup.");
                    }
                });
            });
        }

        // Delete current bracket
        document.getElementById('deleteBracketBtn').addEventListener('click', async () => {
            if (!window.currentBracket) return alert('No bracket to delete');
            const name = window.currentBracket.name;
            if (!confirm(`Are you sure you want to delete ${name}?`)) return;

            try {
                const res = await fetch(`/deleteBracket/${name}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Bracket deleted');
                    window.currentBracket = null;
                    document.querySelector("#bracketTable tbody").innerHTML = '<tr><td colspan="4">No bracket selected</td></tr>';
                    document.getElementById('roundSelect').innerHTML = '';
                }
            } catch (err) {
                console.error(err);
                alert('Error deleting bracket');
            }
        });
    </script>

    <script>
        /**
        * Show sign in button if logged out or show account dropdown if signed in.
        */
        async function checkLoggedUser() {
            let response = await fetch('/loggedUser');
            let user = await response.json();
            const signInBtn = document.getElementById('signin-btn');
            const accountDropdown = document.getElementById('account-dropdown');

            if (user) {
                signInBtn.style.display = 'none';
                accountDropdown.style.display = 'block';

                // show admin option only if user is an admin
                if (user.role === 'admin') {
                    document.getElementById('admin').style.display = 'block';
                } else {
                    document.getElementById('admin').style.display = 'none';
                }
            } else {
                signInBtn.style.display = 'block';
                accountDropdown.style.display = 'none';
            }
            checkAdminAccess(user);
        }

    </script>

</body>
