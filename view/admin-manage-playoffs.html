<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <title>Admin - Manage Playoff Brackets</title>
    <style>
        .bracket-container {
        display: flex;
        overflow-x: auto;
        padding: 20px 10px;
        gap: 40px;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            gap: 40px;
            min-width: 200px;
        }

        .bracket-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .matchup {
            position: relative;
            background: white;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #007bff;
            width: 180px;
        }

        .team {
            padding: 5px 8px;
        }

        .team + .team {
            border-top: 1px solid #ccc;
        }

        /* Lines connecting matchups */
        .matchup::after {
            content: "";
            position: absolute;
            top: 50%;
            right: -40px;
            width: 40px;
            height: 2px;
            background: #0004;
        }

        .bracket-round:last-child .matchup::after {
            display: none; /* no lines after final round */
        }

        .matchup {
            position: relative;
            padding: 15px;
            margin: 10px 0;
            background: #f5f5f5;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .matchup-header {
            position: absolute;
            top: 6px;
            right: 6px;
        }

        .delete-matchup {
            cursor: pointer;
            font-size: 18px;
            color: #b30000;
            transition: 0.2s ease;
        }

        .delete-matchup:hover {
            color: #ff0000;
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!--nav bar-->
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <nav class="navbar navbar-dark bg-primary">

            <!--logo-->
            <a class="navbar-brand" href="/index.html">
                <img src="/images/logo placeholder.jpg" width="30" height="30" class="d-inline-block align-top" alt="">
                littleLIGA
            </a>
        </nav>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!--options-->
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-item nav-link active" href="/index.html">Home <span class="sr-only">(current)</span></a>
                <a class="nav-item nav-link" href="#">League</a>
                <a class="nav-item nav-link" href="#">Matches</a>
                <a class="nav-item nav-link" href="#">Team</a>
                <a class="nav-item nav-link" href="/calendar.html">Calendar</a>
            </div>
        </div>

        <!--sign in button-->
        <div id="signin-btn" class="ms-auto">
            <a class="btn btn-dark btn-rounded" href="/login.html">SIGN IN</a>
        </div>

        <!--account and log out dropdown-->
        <div id="account-dropdown" class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person"
                    viewBox="0 0 16 16">
                    <path
                        d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                </svg> Account
            </button>
            <ul class="dropdown-menu">

    <!--Playoff Brackets-->
    <div class="container">
        <h2 class="text-center mb-4">🏆 Manage Playoff Brackets</h2>

        <!-- Action Cards -->
        <div class="row justify-content-center mb-4">
            <!-- Delete Bracket -->
            <div class="col-md-5 mb-3">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title">Delete Current Bracket</h5>
                        <p class="card-text text-muted">Remove the currently loaded playoff bracket.</p>
                        <button class="btn btn-danger" id="deleteBracketBtn">Delete Bracket</button>
                    </div>
                </div>
            </div>

            <!-- Add Matchup -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <h5 class="card-title">Add Match to Round</h5>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Select Round</label>
                            <select id="roundSelect" class="form-select"></select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Home Team</label>
                            <select id="homeTeamSelect" class="form-select"></select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Away Team</label>
                            <select id="awayTeamSelect" class="form-select"></select>
                        </div>

                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-primary w-100" onclick="addMatchToRound()">Add Match</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bracket Table -->
        <div class="card shadow">
            <div class="card-body">
                <h5 class="card-title">🏆 Current Bracket</h5>
                <div id="bracketContainer" class="bracket-container">
                    <p class="text-muted">Loading bracket...</p>
                </div>
            </div>
        </div>
    </div>

    <!--Functions for brackets-->
    <script>
        // Load the bracket on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await populateTeamDropdowns();
            const params = new URLSearchParams(window.location.search);
            const size = parseInt(params.get('size'));

            if (size) {
                try {
                    const qualifyingTeams = await fetchQualifyingTeams(size); // sorted highest to lowest
                    const currentYear = new Date().getFullYear();
                    const timestamp = Date.now(); // milliseconds since epoch
                    const bracketName = `Bracket_${currentYear}_${timestamp}`;
                    const rounds = generateInitialRounds(qualifyingTeams);

                    const response = await fetch('/createBracket', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: bracketName, numTeams: size, rounds })
                    });

                    if (!response.ok) throw new Error('Failed to create bracket');

                    const bracket = await response.json();
                    window.currentBracket = bracket;
                    displayBracket(bracket);
                    populateRoundsDropdown(bracket);
                } catch (err) {
                    console.error(err);
                    alert('Error generating bracket');
                }
            } else {
                loadBrackets(); // fallback if no size param
            }
        });

        async function fetchQualifyingTeams(size) {
            const res = await fetch('/getAllTeams');
            const teams = await res.json();
            // Sort by rank (highest to lowest)
            teams.sort((a, b) => b.rank - a.rank);
            return teams.slice(0, size).map(t => t.name);
        }

        // Generate initial rounds using seeded teams
        function generateInitialRounds(teams) {
            let rounds = [], roundNumber = 1;
            let currentTeams = [...teams];

            while (currentTeams.length >= 2) {
                let matchups = [];
                while (currentTeams.length > 1) {
                    const home = currentTeams.shift();   // highest rank
                    const away = currentTeams.pop();     // lowest rank
                    matchups.push({ homeTeam: home, awayTeam: away, result: null });
                }
                rounds.push({ roundNumber, roundMatchups: matchups });
                currentTeams = matchups.map(() => 'TBD'); // winners unknown
                roundNumber++;
            }

            return rounds;
        }

        // Display bracket in table
        function displayBracket(bracket) {
            const container = document.getElementById("bracketContainer");
            container.innerHTML = ""; // clear old bracket

            bracket.rounds.forEach(round => {
                const roundCol = document.createElement("div");
                roundCol.className = "bracket-round";

                const title = document.createElement("div");
                title.className = "bracket-title";
                title.textContent = `Round ${round.roundNumber}`;
                roundCol.appendChild(title);

                round.roundMatchups.forEach(match => {
                    const box = document.createElement("div");
                    box.className = "matchup";

                    box.innerHTML = `
                        <div class="matchup-header">
                            <span class="delete-matchup" data-round="${round.roundNumber}" data-home="${match.homeTeam}" data-away="${match.awayTeam}">🗑️</span>
                        </div>
                        <div class="team">${match.homeTeam}</div>
                        <div class="team">${match.awayTeam}</div>
                    `;

                    roundCol.appendChild(box);
                });

                container.appendChild(roundCol);
                deleteMatchup();
            });
        }

        // Populate rounds dropdown
        function populateRoundsDropdown(bracket) {
            const select = document.getElementById('roundSelect');
            select.innerHTML = '';

            bracket.rounds.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.roundNumber;
                opt.textContent = `Round ${r.roundNumber}`;
                select.appendChild(opt);
            });
        }

        // Populate teams dropdown
        async function populateTeamDropdowns() {
            const res = await fetch('/getAllTeams');
            const teams = await res.json();

            const homeSel = document.getElementById('homeTeamSelect');
            const awaySel = document.getElementById('awayTeamSelect');

            homeSel.innerHTML = "";
            awaySel.innerHTML = "";

            teams.forEach(t => {
                const opt1 = document.createElement("option");
                opt1.textContent = t.name;
                opt1.value = t.name;

                const opt2 = opt1.cloneNode(true);

                homeSel.appendChild(opt1);
                awaySel.appendChild(opt2);
            });
        }
        
        // Add a match to a round
        async function addMatchToRound() {
            if (!window.currentBracket) {
                return alert("No bracket loaded.");
            }

            const roundNumber = parseInt(document.getElementById("roundSelect").value);
            const homeTeam = document.getElementById("homeTeamSelect").value;
            const awayTeam = document.getElementById("awayTeamSelect").value;

            if (homeTeam === awayTeam) {
                return alert("A team cannot play against itself.");
            }

            if (!homeTeam || !awayTeam) {
                return alert("You must select both teams.");
            }

            const round = window.currentBracket.rounds.find(r => r.roundNumber === roundNumber);
            if (!round) return alert("Invalid round selected.");

            // Prevent team from having more than one game in a round
            const hasDuplicate = round.roundMatchups.some(m =>
                m.homeTeam === homeTeam ||
                m.awayTeam === homeTeam ||
                m.homeTeam === awayTeam ||
                m.awayTeam === awayTeam
            )
            if (hasDuplicate) {
                return alert("One or more of these teams already play in this round.")
            }

            // Prevent matchups in round from exceeding maximum
            const expectedNumTeams = window.currentBracket.numTeams / Math.pow(2, roundNumber - 1);
            const maxNumMatchups = expectedNumTeams / 2;
            const realMatchCount = round.roundMatchups.filter(m =>
                m.homeTeam !== "TBD" && m.awayTeam !== "TBD"
            ).length;

            if (realMatchCount >= maxNumMatchups) {
                return alert("This round is already full — cannot add more matchups.");
            }



            const match = {
                homeTeam,
                awayTeam,
                result: null
            };

            try {
                const res = await fetch(`/addMatchup/${window.currentBracket.name}/${roundNumber}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(match)
                });

                if (!res.ok) throw new Error("Server error adding match");

                const updatedBracket = await res.json();
                window.currentBracket = updatedBracket;

                displayBracket(updatedBracket);

                alert("Match added successfully.");
            } catch (err) {
                console.error(err);
                alert("Failed to add match.");
            }
        }

        // Load existing brackets
        async function loadBrackets() {
            try {
                const res = await fetch('/getAllBrackets');
                const brackets = await res.json();
                if (brackets.length > 0) {
                    window.currentBracket = brackets[0]; // pick first
                    displayBracket(brackets[0]);
                    populateRoundsDropdown(brackets[0]);
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Delete a matchup
        async function deleteMatchup() {
            document.querySelectorAll(".delete-matchup").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const round = btn.dataset.round;
                    const homeTeam = btn.dataset.home;
                    const awayTeam = btn.dataset.away;

                    if (!confirm("Are you sure you want to delete this matchup?")) return;

                    try {
                        const res = await fetch(`/deleteMatchup/${encodeURIComponent(window.currentBracket.name)}/${round}/${encodeURIComponent(homeTeam)}/${encodeURIComponent(awayTeam)}`, {
                            method: "DELETE"
                        });

                        if (!res.ok) throw new Error("Failed to delete matchup.");

                        const updatedBracket = await res.json();
                        window.currentBracket = updatedBracket;
                        displayBracket(updatedBracket);

                    } catch (err) {
                        console.error(err);
                        alert("Error deleting matchup.");
                    }
                });
            });
        }

        // Delete current bracket
        document.getElementById('deleteBracketBtn').addEventListener('click', async () => {
            if (!window.currentBracket) return alert('No bracket to delete');
            const name = window.currentBracket.name;
            if (!confirm(`Are you sure you want to delete ${name}?`)) return;

            try {
                const res = await fetch(`/deleteBracket/${name}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Bracket deleted');
                    window.currentBracket = null;
                    document.querySelector("#bracketTable tbody").innerHTML = '<tr><td colspan="4">No bracket selected</td></tr>';
                    document.getElementById('roundSelect').innerHTML = '';
                }
            } catch (err) {
                console.error(err);
                alert('Error deleting bracket');
            }
        });
    </script>

    <script>
        /**
        * Show sign in button if logged out or show account dropdown if signed in.
        */
        async function checkLoggedUser() {
            let response = await fetch('/loggedUser');
            let user = await response.json();
            const signInBtn = document.getElementById('signin-btn');
            const accountDropdown = document.getElementById('account-dropdown');

            if (user) {
                signInBtn.style.display = 'none';
                accountDropdown.style.display = 'block';

                // show admin option only if user is an admin
                if (user.role === 'admin') {
                    document.getElementById('admin').style.display = 'block';
                } else {
                    document.getElementById('admin').style.display = 'none';
                }
            } else {
                signInBtn.style.display = 'block';
                accountDropdown.style.display = 'none';
            }
            checkAdminAccess(user);
        }

    </script>

</body>
