<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <title>View Playoff Bracket</title>
    <style>
        .bracket-container {
            display: flex;
            overflow-x: auto;
            padding: 20px 10px;
            gap: 40px;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            gap: 40px;
            min-width: 200px;
        }

        .bracket-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .matchup {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .team {
            padding: 5px 8px;
        }

        .team+.team {
            border-top: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="/index.html">
            <img src="/images/logo placeholder.jpg" width="30" height="30" class="d-inline-block align-top" alt="">
            littleLIGA
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-item nav-link" href="/index.html">Home <span class="sr-only">(current)</span></a>
                <a class="nav-item nav-link" href="#">League</a>
                <a class="nav-item nav-link" href="/match.html">Matches</a>
                <a class="nav-item nav-link" href="/team.html">Team</a>
                <a class="nav-item nav-link" href="/calendar.html">Calendar</a>
            </div>
        </div>
    </nav>

    <!-- Bracket Display -->
    <div class="container mt-4">
        <h2 class="text-center mb-4">🏆 Current Playoff Bracket</h2>
        <div id="bracketContainer" class="bracket-container">
            <p class="text-muted">Loading bracket...</p>
        </div>
    </div>

    <script>
        // Load the first bracket on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/getAllBrackets');
                const brackets = await res.json();
                if (brackets.length === 0) {
                    document.getElementById('bracketContainer').innerHTML = '<p>No brackets available.</p>';
                    return;
                }
                const bracket = brackets[0]; // Display first bracket
                displayBracket(bracket);
            } catch (err) {
                console.error(err);
                document.getElementById('bracketContainer').innerHTML = '<p>Error loading bracket.</p>';
            }
        });

        // Display bracket read-only
        function displayBracket(bracket) {
            const container = document.getElementById("bracketContainer");
            container.innerHTML = "";

            const lastRoundNumber = Math.max(...bracket.rounds.map(r => r.roundNumber));

            bracket.rounds.forEach(round => {
                const roundCol = document.createElement("div");
                roundCol.className = "bracket-round";

                const title = document.createElement("div");
                title.className = "bracket-title";
                title.textContent = round.roundNumber === lastRoundNumber
                    ? "🏆 Championship Round"
                    : `Round ${round.roundNumber}`;
                roundCol.appendChild(title);

                round.roundMatchups.forEach(match => {
                    const box = document.createElement("div");
                    box.className = "matchup";
                    box.innerHTML = `
                        <div class="team">${match.homeTeam || "TBD"}</div>
                        <div class="team">${match.awayTeam || "TBD"}</div>
                    `;
                    roundCol.appendChild(box);
                });

                container.appendChild(roundCol);
            });
        }
    </script>
</body>

</html>
