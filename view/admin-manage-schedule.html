    <script>
        /**
        * Show sign in button if logged out or show account dropdown if signed in.
        */
        async function checkLoggedUser() {
            let response = await fetch('/loggedUser');
            let user = await response.json();
            const signInBtn = document.getElementById('signin-btn');
            const accountDropdown = document.getElementById('account-dropdown');

            if (user) {
                signInBtn.style.display = 'none';
                accountDropdown.style.display = 'block';

                // show admin option only if user is an admin
                if (user.role === 'admin') {
                    document.getElementById('admin').style.display = 'block';
                } else {
                    document.getElementById('admin').style.display = 'none';
                }
            } else {
                signInBtn.style.display = 'block';
                accountDropdown.style.display = 'none';
            }
        }
        checkLoggedUser();

    </script>

    <!--Schedule Generation-->
    <script>

        async function showGeneratedSchedule() {
            await generateSeasonSchedule();
            window.location.href = "admin-current-schedule.html";
        }

        async function generateSeasonSchedule() {
            let response = await fetch('/getAllTeams', { cache: 'no-store' });
            let teams = await response.json();
            let teamsAndQuality = [];
            for (let team of teams) {
                let totalGamesPlayed = team.priorSeasonWins + team.priorSeasonLosses;
                let teamQuality = team.priorSeasonWins / totalGamesPlayed;
                let teamWithQuality = {
                    name: team.name,
                    strength: teamQuality
                };
                teamsAndQuality.push(teamWithQuality);
            }
            let defaultWeeks = 2;
            let schedule = generateSchedule(teamsAndQuality, defaultWeeks);

            const responseDel = await fetch('/deleteAllWeeks', { method: 'DELETE' });

            for (let i = 0; i < schedule.length; i++) {
                const matches = schedule[i];
                const weekNumber = i + 1;
                if (weekNumber > 0) {
                    const res = await fetch('/createWeek', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            weekNumber,
                            matchups: matches
                        })
                    });
                    if (!res.ok) {
                        console.error(`Failed to save week ${weekNumber}:`, await res.text());
                    }
                }
            }
            return schedule
        }

        function generateSchedule(teams, numWeeks) {
            let schedule = [];
            // avoiding repeat matchups
            let matchHistory = new Set();
            for (let week = 1; week <= numWeeks; week++) {
                let shuffled = shuffleTeams([...teams]);
                let weeksMatches = [];
                while (shuffled.length > 1) {
                    let teamA = shuffled.shift();
                    // get possible opponents teamA has not faced
                    let possibleOpponents = shuffled.filter(t => {
                        const key1 = `${teamA.name}-${t.name}`;
                        const key2 = `${t.name}-${teamA.name}`;
                        return !matchHistory.has(key1) && !matchHistory.has(key2);
                    });
                    if (possibleOpponents.length == 0) {
                        continue;
                    }
                    // sort possible opponents by most similar strenth
                    possibleOpponents.sort((a, b) =>
                        Math.abs(teamA.strength - a.strength) - Math.abs(teamA.strength - b.strength)
                    );
                    let opponent;
                    // choose similar strength opponent 80% of time, random opponent 20% of time
                    if (Math.random() < 0.8) {
                        opponent = possibleOpponents[0];
                    }
                    else {
                        // choose random opponent out of possible choices
                        opponent = possibleOpponents[Math.floor(Math.random() * possibleOpponents.length)];
                    }
                    // remove opponent from list
                    shuffled.splice(shuffled.indexOf(opponent), 1);
                    // add matchup to the weeks matches
                    let matchup = {
                        week,
                        homeTeam: teamA.name,
                        awayTeam: opponent.name
                    };
                    weeksMatches.push(matchup);
                    matchHistory.add(`${teamA.name}-${opponent.name}`);
                    matchHistory.add(`${opponent.name}-${teamA.name}`);
                }
                // add the weeks matches to the season schedule
                schedule.push(weeksMatches);
            }
            // return the entire seasons schedule
            return schedule;
        }

        function shuffleTeams(teams) {
            let currentIndex = teams.length;
            while (currentIndex != 0) {
                let randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [teams[currentIndex], teams[randomIndex]] = [teams[randomIndex], teams[currentIndex]];
            }
            return teams;
        }

    </script>
