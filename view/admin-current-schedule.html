    <script>
        /**
        * Show sign in button if logged out or show account dropdown if signed in.
        */
        async function checkLoggedUser() {
            let response = await fetch('/loggedUser');
            let user = await response.json();
            const signInBtn = document.getElementById('signin-btn');
            const accountDropdown = document.getElementById('account-dropdown');

            if (user) {
                signInBtn.style.display = 'none';
                accountDropdown.style.display = 'block';

                // show admin option only if user is an admin
                if (user.role === 'admin') {
                    document.getElementById('admin').style.display = 'block';
                } else {
                    document.getElementById('admin').style.display = 'none';
                }
            } else {
                signInBtn.style.display = 'block';
                accountDropdown.style.display = 'none';
            }
        }
        checkLoggedUser();
    </script>
    
    <!--calendar page-->
    <script>
    // Show the calendar section when Calendar link is clicked
    document.getElementById('calendar-link').addEventListener('click', (e) => {
        e.preventDefault();
        showCalendar();
    });

    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    async function showCalendar() {
        document.getElementById('calendar-section').style.display = 'block';
        await loadCalendar(currentYear, currentMonth);
    }

    async function loadCalendar(year, monthIndex) {
        const res = await fetch(`/calendar/data/${monthIndex}?year=${year}`);
        const data = await res.json();
        renderCalendar(data);
    }

    function renderCalendar(data) {
        const body = document.getElementById('calendar-body');
        const monthYear = document.getElementById('month-year');
        monthYear.textContent = `${data.monthName} ${data.year}`;
        body.innerHTML = '';

        data.data.forEach(week => {
        const tr = document.createElement('tr');
        week.forEach(day => {
            const td = document.createElement('td');
            td.textContent = day || '';
            if (day) td.classList.add('day');
            tr.appendChild(td);
        });
        body.appendChild(tr);
        });
    }

    document.getElementById('prev-month').addEventListener('click', async () => {
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        await loadCalendar(currentYear, currentMonth);
    });

    document.getElementById('next-month').addEventListener('click', async () => {
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        await loadCalendar(currentYear, currentMonth);
    });


    async function loadWeek1Schedule() {
      try {
        const response = await fetch('/api/schedule/1'); // Your backend endpoint
        if (!response.ok) throw new Error('Failed to fetch week 1');

        const weekData = await response.json();
        const tbody = document.querySelector("#scheduleTable tbody");
        tbody.innerHTML = ''; // clear table

        weekData.weekMatchups.forEach(match => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${match.homeTeam}</td>
            <td>${match.awayTeam}</td>
            <td>${match.result || '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        alert('Error loading schedule');
      }
    }

    // Load the table when the page loads
    window.addEventListener('DOMContentLoaded', loadWeek1Schedule);
    </script>



    <!-- calendar -->
