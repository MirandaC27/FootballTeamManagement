        /**
        * Show sign in button if logged out or show account dropdown if signed in.
        */
        async function checkLoggedUser() {
            let response = await fetch('/loggedUser');
            let user = await response.json();
            const signInBtn = document.getElementById('signin-btn');
            const accountDropdown = document.getElementById('account-dropdown');

            if (user) {
                signInBtn.style.display = 'none';
                accountDropdown.style.display = 'block';

                // show admin option only if user is an admin
                if (user.role === 'admin') {
                    document.getElementById('admin').style.display = 'block';
                } else {
                    document.getElementById('admin').style.display = 'none';
                }
            } else {
                signInBtn.style.display = 'block';
                accountDropdown.style.display = 'none';
            }
        }
        checkLoggedUser();
    </script>

    <!--calendar page-->
    <script>
        // Show the calendar section when Calendar link is clicked
        document.getElementById('calendar-link').addEventListener('click', (e) => {
            e.preventDefault();
            showCalendar();
        });

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        async function showCalendar() {
            document.getElementById('calendar-section').style.display = 'block';
            await loadCalendar(currentYear, currentMonth);
        }

        async function loadCalendar(year, monthIndex) {
            const res = await fetch(`/calendar/data/${monthIndex}?year=${year}`);
            const data = await res.json();
            renderCalendar(data);
        }

        function renderCalendar(data) {
            const body = document.getElementById('calendar-body');
            const monthYear = document.getElementById('month-year');
            monthYear.textContent = `${data.monthName} ${data.year}`;
            body.innerHTML = '';

            data.data.forEach(week => {
                const tr = document.createElement('tr');
                week.forEach(day => {
                    const td = document.createElement('td');
                    td.textContent = day || '';
                    if (day) td.classList.add('day');
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
        }

        document.getElementById('prev-month').addEventListener('click', async () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            await loadCalendar(currentYear, currentMonth);
        });

        document.getElementById('next-month').addEventListener('click', async () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            await loadCalendar(currentYear, currentMonth);
        });
    </script>

    <!--Load Schedule Table-->
    <script>
        async function clearAllWeeks() {
            const responseDel = await fetch('/deleteAllWeeks', { method: 'DELETE' });
            const responseCreate = await generateSeasonSchedule()
            window.location.href = "admin-current-schedule.html";
        }

        async function loadWeekOptions() {
            try {
            const response = await fetch('/getAllWeeks', { cache: 'no-store' });
            if (!response.ok) throw new Error('Failed to fetch available weeks');

            const weeks = await response.json();
            const select = document.getElementById('weekSelect');
            select.innerHTML = '';

            if (!weeks || weeks.length === 0) {
                select.innerHTML = `<option disabled>No weeks available</option>`;
                document.querySelector("#scheduleTable tbody").innerHTML =
                `<tr><td colspan="3">No weeks found.</td></tr>`;
                return;
            }

            //Sort by weekNumber (in case backend returns unordered)
            weeks.sort((a, b) => a.weekNumber - b.weekNumber);

            //Populate dropdown
            weeks.forEach(week => {
                const opt = document.createElement('option');
                opt.value = week.weekNumber;
                opt.textContent = `Week ${week.weekNumber}`;
                select.appendChild(opt);
            });

            //Store data in memory to avoid re-fetching
            window.scheduleData = weeks;

            //Auto-load the first week
            select.value = weeks[0].weekNumber;
            renderWeek(weeks[0]);
            } catch (err) {
            console.error(err);
            document.getElementById('weekSelect').innerHTML =
                `<option disabled>Error loading weeks</option>`;
            document.querySelector("#scheduleTable tbody").innerHTML =
                `<tr><td colspan="3" style="color:red;">Error loading weeks</td></tr>`;
            }
        }

        //Render a week's schedule (no need to fetch again)
        function renderWeek(weekData) {
            const tbody = document.querySelector("#scheduleTable tbody");
            tbody.innerHTML = "";

            if (!weekData.weekMatchups || weekData.weekMatchups.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3">No matchups available for this week.</td></tr>`;
            return;
            }

            weekData.weekMatchups.forEach(match => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${match.homeTeam}</td>
                <td>${match.awayTeam}</td>
                <td>${match.result || '-'}</td>
            `;
            tbody.appendChild(tr);
            });
        }

        //Change week when user selects another
        function loadWeekSchedule() {
            const selectedWeek = parseInt(document.getElementById("weekSelect").value);
            const selectedData = window.scheduleData.find(w => w.weekNumber === selectedWeek);
            if (selectedData) renderWeek(selectedData);
        }

        async function generateSeasonSchedule() {
            let response = await fetch('/getAllTeams', { cache: 'no-store' });
            let teams = await response.json();
            let teamsAndQuality = [];
            for (let team of teams) {
                let totalGamesPlayed = team.priorSeasonWins + team.priorSeasonLosses;
                let teamQuality = team.priorSeasonWins / totalGamesPlayed;
                let teamWithQuality = {
                    name: team.name,
                    strength: teamQuality
                };
                teamsAndQuality.push(teamWithQuality);
            }
            let defaultWeeks = 2;
            let schedule = generateSchedule(teamsAndQuality, defaultWeeks);

            const responseDel = await fetch('/deleteAllWeeks', { method: 'DELETE' });

            for (let i = 0; i < schedule.length; i++) {
                const matches = schedule[i];
                const weekNumber = i + 1;
                if (weekNumber > 0) {
                    const res = await fetch('/createWeek', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            weekNumber,
                            matchups: matches
                        })
                    });
                    if (!res.ok) {
                        console.error(`Failed to save week ${weekNumber}:`, await res.text());
                    }
                }
            }
            return schedule
        }

        function generateSchedule(teams, numWeeks) {
            let schedule = [];
            // avoiding repeat matchups
            let matchHistory = new Set();
            for (let week = 1; week <= numWeeks; week++) {
                let shuffled = shuffleTeams([...teams]);
                let weeksMatches = [];
                while (shuffled.length > 1) {
                    let teamA = shuffled.shift();
                    // get possible opponents teamA has not faced
                    let possibleOpponents = shuffled.filter(t => {
                        const key1 = `${teamA.name}-${t.name}`;
                        const key2 = `${t.name}-${teamA.name}`;
                        return !matchHistory.has(key1) && !matchHistory.has(key2);
                    });
                    if (possibleOpponents.length == 0) {
                        continue;
                    }
                    // sort possible opponents by most similar strenth
                    possibleOpponents.sort((a, b) =>
                        Math.abs(teamA.strength - a.strength) - Math.abs(teamA.strength - b.strength)
                    );
                    let opponent;
                    // choose similar strength opponent 80% of time, random opponent 20% of time
                    if (Math.random() < 0.8) {
                        opponent = possibleOpponents[0];
                    }
                    else {
                        // choose random opponent out of possible choices
                        opponent = possibleOpponents[Math.floor(Math.random() * possibleOpponents.length)];
                    }
                    // remove opponent from list
                    shuffled.splice(shuffled.indexOf(opponent), 1);
                    // add matchup to the weeks matches
                    let matchup = {
                        week,
                        homeTeam: teamA.name,
                        awayTeam: opponent.name
                    };
                    weeksMatches.push(matchup);
                    matchHistory.add(`${teamA.name}-${opponent.name}`);
                    matchHistory.add(`${opponent.name}-${teamA.name}`);
                }
                // add the weeks matches to the season schedule
                schedule.push(weeksMatches);
            }
            // return the entire seasons schedule
            return schedule;
        }

        function shuffleTeams(teams) {
            let currentIndex = teams.length;
            while (currentIndex != 0) {
                let randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [teams[currentIndex], teams[randomIndex]] = [teams[randomIndex], teams[currentIndex]];
            }
            return teams;
        }

        // Load the table when the page loads
        window.addEventListener('DOMContentLoaded', loadWeekOptions);

    </script>
