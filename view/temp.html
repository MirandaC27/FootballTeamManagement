<script>

    function updateScoreboard(){
            document.getElementById('homeScore').textContent = currScore.teamHome;
            document.getElementById('awayScore').textContent = currScore.teamAway;
        }

    function recalcScore(){
            let newScores = {teamHome: 0, teamAway: 0};
            matchEvents.forEach(event=> {
                if(event.type == 'goal'){
                    if(event.team == 'home'){
                        newScores.teamHome++;
                    }
                    else if(event.team == 'away'){
                        newScores.teamAway++;
                    }
                }

            });

            const scoreChanged = newScores.teamHome !== currScore.teamHome || newScores.teamAway !== currScore.teamAway;
            currScore = newScores;
            document.getElementById('homeScore').textContent = currScore.teamHome;
            document.getElementById('awayScore').textContent = currScore.teamAway;

            const matchId = new URLSearchParams(window.location.search).get('id');
            if (scoreChanged && matchId) {
                updateScore(matchId, { homeScore: currScore.teamHome, awayScore: currScore.teamAway });
            }

            //updateScoreboard();
            //updateScore(matchId, {homeScore: currScore.teamHome, awayScore: currScore.teamAway});
        }

    async function logEvent(){
            const selectType = document.getElementById('event-type');
            const typeSelected = selectType.value;
            const selectTeam = document.getElementById('event-team');
            const teamSelected = selectTeam.value;
            const inputMin = document.getElementById('event-minute');
            const inputDesc = document.getElementById('event-desc');

            const eventMinute = parseInt(inputMin.value, 10);

            const eventDesc = inputDesc.value.trim();

            const newEvent = {
                minute: eventMinute,
                type: typeSelected,
                description: eventDesc,
                team: teamSelected,
                timestamp: new Date().toISOString()
            };

            try{
                const res = await fetch(`/api/matches/${matchId}/events`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(newEvent)
                });
            }
            catch (err){
                console.error("error logging event:", err.message);
            }

            console.log("event saved, reloading page");
            await loadMatch(matchId);
            /*matchEvents.push(newEvent);*/


            inputDesc.value = '';
            inputDesc.focus();
        }

    function loadTimeline(){
            /*recalcScore();*/

            if(!currMatch) return;

            const timelineContainer = document.getElementById('timeline-container');
            timelineContainer.innerHTML = '';

            matchEvents.sort((a, b) => a.minute - b.minute);
            matchEvents.forEach(event => {
                const teamName = event.team == 'home' ? currMatch.homeTeam : currMatch.awayTeam;
                const eventItem = document.createElement('div');
                eventItem.className = 'timeline-item';

                eventItem.innerHTML =
                 `<strong>${event.minute} | ${event.type}:<strong>${event.description} <em>(${teamName})</em>`;

                timelineContainer.appendChild(eventItem);

            });
        
        }


    async function changeMatchStatus(newStatus) {
            const matchId = new URLSearchParams(window.location.search).get('id');

            if (!matchId) return console.error('Match ID not found.');

            try {
                const res = await fetch(`getMatchDetails/${matchId}/matchStatus`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.ok) {
                    console.log(`Match status updated to: ${newStatus}`);
                    // Force a refresh to update the UI immediately
                    // This calls your adapted loadMatchAndRender function from the previous step
                    //await loadMatchAndRender(matchId); 
                    await loadMatch(matchId);
                } else {
                    // Handle server errors (e.g., status 400 or 500)
                    const errorData = await res.json();
                    alert(`Failed to update status: ${errorData.message}`);
                }
            } catch (error) {
                console.error('Network error during status update:', error);
                alert('Could not connect to the server.');
            }
        }
</script>
