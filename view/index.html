<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <title>Home - Soccer League Management</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!--nav bar-->
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <nav class="navbar navbar-dark bg-primary">

            <!--logo-->
            <a class="navbar-brand" href="/index.html">
                <img src="/images/logo placeholder.jpg" width="30" height="30" class="d-inline-block align-top" alt="">
                littleLIGA
            </a>
        </nav>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!--options-->
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-item nav-link active" href="/index.html">Home <span class="sr-only">(current)</span></a>
                <a class="nav-item nav-link" href="#">League</a>
                <a class="nav-item nav-link" href="#">Matches</a>
                <a class="nav-item nav-link" href="#">Team</a>
                <a class="nav-item nav-link" href="/calendar.html">Calendar</a>
            </div>
        </div>

        <!--sign in button-->
        <div id="signin-btn" class="ms-auto">
            <a class="btn btn-dark btn-rounded" href="/login.html">SIGN IN</a>
        </div>

        <!--account and log out dropdown-->
        <div id="account-dropdown" class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person"
                    viewBox="0 0 16 16">
                    <path
                        d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                </svg> Account
            </button>
            <ul class="dropdown-menu">
                <li id="admin"><a class="dropdown-item" href="/admin.html">Admin</a></li>
                <li><a class="dropdown-item" href="/logout">Log out</a></li>
            </ul>
        </div>
    </nav>

    <div class="ticker">
        <span>⚽ littleLIGA — Stay updated with schedules, standings, and shared game highlights.</span>
    </div>

    <!-- SECTIONS (calendar, social feed, standings) -->
    <div class="flex-container">

        <!-- Standings Section (left column) -->
        <div class="standings-col">
            <h4 class="text-center mt-3 mb-1" style="font-weight:600;">
                Standings
            </h4>
            <hr style="width:50%; margin:0 auto 15px auto; border-top: 2px solid #4a68f0;">

            <div class="standings-table-container">
                <table class="table table-striped table-bordered">
                    <thead class="bg-primary text-white">
                        <tr>
                            <th scope="col">Team</th>
                            <th scope="col">W</th>
                            <th scope="col">L</th>
                            <th scope="col">Points</th>
                        </tr>
                    </thead>

                    <tbody id="userTableBody">
                    </tbody>
                </table>
            </div>
        </div>


        <!-- Social Feed Section (middle column) -->
        <div class="social-feed-col">

            <div class="post-box" id="postBox" style="display:none">
                <button id="createPostBtn" class="btn btn-primary w-100"> + Create Post</button>

                <!-- text input -->
                <div id="postForm" class="post-form" style="display:none">
                    <textarea id="postText" class="form-control mb-3" rows="3" placeholder="Add comment"></textarea>

                    <!-- media input -->
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <!-- file input -->
                            <label class="btn btn-outline-primary mr-2">
                                📷 Image
                                <input type="file" id="imageInput" accept="image/*" hidden>
                            </label>

                            <label class="btn btn-outline-primary">
                                🎥 Video
                                <input type="file" id="videoInput" accept="video/*" hidden>
                            </label>
                        </div>

                        <!-- checkbox -->
                        <label style="color:red">
                            <input type="checkbox" id="containsMinorsCheckbox"> This post includes minors
                        </label>

                        <!-- Cancel and Share button -->
                        <div class="d-flex justify-content-end align-items-center gap-2 mt-3">
                            <button id="cancel-post-btn" class="btn btn-light">Cancel</button>
                            <button id="share-post-btn" class="btn btn-primary">Share</button>
                        </div>
                    </div>

                    <!-- items to send to backend (file, text, boolean for if contain minors)-->
                    <form id="uploadForm" enctype="multipart/form-data" style="display:none">
                        <input type="file" id="fileInput" name="media">
                        <input type="hidden" name="caption" id="caption">
                        <input type="hidden" name="containsMinors" id="containsMinors">
                    </form>

                    <p id="statusMessage"></p>
                    <div id="mediaPreview" style="margin-top: 10px"></div>
                </div>
            </div>
            <!-- display all posts -->
            <div id="feed" class="mt-4"></div>
        </div>

        <!-- Calendar Section (right column) -->
        <div class="calendar-col">
            <iframe src="/calendar.html" style="width:100%; height:650px; border:none; overflow:hidden"
                scrolling="no"></iframe>
        </div>

    </div>

    <!-- Footer -->
    <footer class="text-center p-3" style="font-size: 0.9rem; color:#aeaeae;">
        © 2025 littleLIGA Teen Soccer League
    </footer>

    <script>
        /**
        * Show sign in button if logged out or show account dropdown if signed in.
        */
        async function checkLoggedUser() {
            let response = await fetch('/loggedUser');
            let user = await response.json();
            const signInBtn = document.getElementById('signin-btn');
            const accountDropdown = document.getElementById('account-dropdown');

            if (user) {
                signInBtn.style.display = 'none';
                accountDropdown.style.display = 'block';
                postBox.style.display = 'block';
                allowCreatePost();

                // show admin option only if user is an admin
                if (user.role === 'admin') {
                    document.getElementById('admin').style.display = 'block';
                } else {
                    document.getElementById('admin').style.display = 'none';
                }
            } else {
                signInBtn.style.display = 'block';
                accountDropdown.style.display = 'none';
            }
        }

        /**
         * Reveal the post creation input when user is logged in.
         */
        function allowCreatePost() {
            createPostBtn.onclick = () => {
                createPostBtn.style.display = "none";
                postForm.style.display = "block";
            };
        }
        checkLoggedUser();
    </script>

    <script>
        /**
         * Display a table of all teams from database.
         */
        async function displayTeams() {
            let response = await fetch('/getAllTeams');
            let teams = await response.json();
            let tbody = document.getElementById('userTableBody');

            for (let team of teams) {
                const tr = createTeamRow(team);
                tbody.appendChild(tr);
            }
        }

        /**
         * Create a table row for a single team.
         */
        function createTeamRow(team) {
            let tr = document.createElement('tr');
            let teamName = document.createElement('td');
            let teamWins = document.createElement('td');
            let teamLosses = document.createElement('td');
            let teamPoints = document.createElement('td');

            teamName.appendChild(document.createTextNode(team.name));
            teamWins.appendChild(document.createTextNode(team.wins));
            teamLosses.appendChild(document.createTextNode(team.losses));
            teamPoints.appendChild(document.createTextNode(team.wins * 3));

            tr.appendChild(teamName);
            tr.appendChild(teamWins);
            tr.appendChild(teamLosses);
            tr.appendChild(teamPoints);

            return tr;
        }
        displayTeams();
    </script>

    <script>
        // Script for buttons on the social feed form:
        const createPostBtn = document.getElementById("createPostBtn");
        const postForm = document.getElementById("postForm");
        const cancelBtn = document.getElementById("cancel-post-btn");
        const shareBtn = document.getElementById("share-post-btn");

        // Show form when user clicks + Create Post
        createPostBtn.addEventListener("click", () => {
            createPostBtn.style.display = "none";
            postForm.style.display = "block";
        });

        // Hide form when user clicks cancel, also clear all inputs
        cancelBtn.addEventListener("click", () => {
            postForm.style.display = "none";
            createPostBtn.style.display = "block";
            statusMessage.style.display = "none";

            postText.value = "";
            imageInput.value = "";
            videoInput.value = "";
            fileInput.value = "";
            document.getElementById("containsMinorsCheckbox").checked = false;
            mediaPreview.innerHTML = "";
        });

    </script>

    <script>
        const form = document.getElementById("uploadForm");
        const statusMessage = document.getElementById("statusMessage");
        const fileInput = document.getElementById("fileInput");
        const imageInput = document.getElementById("imageInput");
        const videoInput = document.getElementById("videoInput");

        /**
         * Handle uploading file by alerting if was a success or failure.
         * @param event object event listener
         */
        async function uploadFile(event) {
            event.preventDefault();

            const formData = new FormData(form);

            try { // display alert depending on backend's success
                const response = await fetch("/upload", { method: "POST", body: formData });
                statusMessage.innerHTML = `<div class="alert-success">✅ Successfully uploaded!</div>`;
                location.reload();

                // Display the message for 3 seconds and reset all inputs
                setTimeout(() => statusMessage.style.display = "none", 3000);
                form.reset();
                imageInput.value = "";
                videoInput.value = "";
                fileInput.value = "";

            } catch (err) {
                console.log(err);
                statusMessage.innerHTML = `<div class="alert-fail">❌ Error uploading file</div>`;
                setTimeout(() => statusMessage.style.display = "none", 3000);
            }
        }
    </script>

    <script>
        // Script for the buttons (image, video, share) for Create Post form:
        form.addEventListener("submit", uploadFile);

        // Image button
        imageInput.addEventListener("change", () => {
            if (imageInput.files.length > 0) {
                fileInput.files = imageInput.files;

                document.getElementById("caption").value = document.getElementById("postText").value;
                document.getElementById("containsMinors").value =
                    document.getElementById("containsMinorsCheckbox").checked ? "true" : "false";
            }
        });

        // Video button
        videoInput.addEventListener("change", () => {
            if (videoInput.files.length > 0) {
                fileInput.files = videoInput.files;

                document.getElementById("caption").value = document.getElementById("postText").value;
                document.getElementById("containsMinors").value =
                    document.getElementById("containsMinorsCheckbox").checked ? "true" : "false";
            }
        });

        // Submit button
        shareBtn.addEventListener("click", () => {
            // all inputs required for database (text, containsMinor boolean)
            document.getElementById("caption").value = document.getElementById("postText").value;
            document.getElementById("containsMinors").value =
                document.getElementById("containsMinorsCheckbox").checked ? "true" : "false";

            // Require a file before sharing
            if (!fileInput.files.length) {
                window.alert('Please upload an image or video before sharing this post.');
                return;
            }
            form.dispatchEvent(new Event("submit"));
        });
    </script>

    <script>
        const mediaPreview = document.getElementById("mediaPreview");

        // Image preview
        imageInput.addEventListener("change", () => {
            if (imageInput.files.length > 0) {
                const file = imageInput.files[0];
                mediaPreview.innerHTML = `
            <img src="${URL.createObjectURL(file)}" 
                 style="max-width: 300px; max-height: 300px; margin-top:10px; border-radius:8px; display:block;">
        `;
            }
        });

        // Video preview
        videoInput.addEventListener("change", () => {
            if (videoInput.files.length > 0) {
                const file = videoInput.files[0];
                mediaPreview.innerHTML = `
            <video controls 
                   style="width: 30%; height: 30%; margin-top:10px; border-radius:8px; display:block">
                <source src="${URL.createObjectURL(file)}">
            </video>`;
            }
        });

        // Clear preview when cancel button is clicked
        cancelBtn.addEventListener("click", () => {
            mediaPreview.innerHTML = "";
        });
    </script>

    <script>
        /**
         * Load all posts on feed.
         */
        async function loadPosts() {
            const feed = document.getElementById("feed");
            feed.innerHTML = "";

            try {
                let response = await fetch("/getAllPosts");
                let posts = await response.json();

                for (let post of posts) {
                    const postCard = document.createElement("div");
                    postCard.className = "feed-post";

                    let media = "";
                    if (post.type.startsWith("image")) {
                        media = `<img src="${post.path}">`;
                    } else if (post.type.startsWith("video")) {
                        media = `<video controls><source src="${post.path}"></video>`;
                    }

                    postCard.innerHTML = `
<div class="post-header d-flex justify-content-between align-items-center mb-2">

  <div class="d-flex align-items-center">

<svg class="user-icon" viewBox="0 0 24 24" fill="none">
  <rect x="3" y="3" width="18" height="18" rx="4" fill="#556B8A"/>
  <circle cx="12" cy="10" r="3" fill="#FFFFFF"/>
  <path d="M7 17c0-2.5 2-4 5-4s5 1.5 5 4" fill="#FFFFFF"/>
</svg>



    <div class="ms-2 d-flex align-items-center">
      <strong>${post.owner_id?.name}</strong>
      <span style="color: gray; font-size: 0.9rem; margin-left: 6px;">
        @${post.owner_id?.username}
      </span>
    </div>

  </div>

  <span style="color: gray; font-size: 0.85rem;">
    ${new Date(post.uploadedAt).toLocaleString()}
  </span>
</div>
<p class="mt-2">${post.caption}</p>
${media}

`;



                    feed.appendChild(postCard);
                }

            } catch (err) {
                console.error(err);
            }
        }
        loadPosts();
    </script>

</body>

</html>
