        function formatDisplayDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            const options = { year: 'numeric', month: 'long', day: 'numeric' }; 
            return date.toLocaleDateString('en-US', options);
        }

        /**
         * Get the coordinates of the city the match is located in
         */
        function getCityCoordinates(cityName){
            //let cityName = cityInput.value.trim();
            //cityInput.value = '';
            if(!cityName) return;
            let GEOCODING_API_URL = `https://api.openweathermap.org/geo/1.0/direct?q=${cityName}&limit=1&appid=${api_key}`;
            fetch(GEOCODING_API_URL).then(res => res.json()).then(data => {
                let {name, lat, lon, country, state} = data[0];
                getWeatherDetails(name, lat, lon, country, state);
            }).catch(() => {
                alert(`Failed to fetch coordinates of ${cityName}`);
            });
        }

        /**
         * Loads the timeline entries from matchEvents
         */
        function loadTimeline(){
            const timelineContainer = document.getElementById('timeline-container');
            timelineContainer.innerHTML = '';

            if(matchEvents.length == 0){
                timelineContainer.innerHTML = 'No events recorded yet';
                return;
            }

            matchEvents.forEach(event => {
                const teamName = event.team == 'home' ? match.homeTeam : match.awayTeam;

                /*
                const icoMap = {
                    'goal': '⚽',
                    'yellow-card': '🟨',
                    'red-card': '🟥',
                    'substitution': '🔄'
                }*/

                //const eventIco = icoMap[event.type] || '';
                const eventEntry = document.createElement('div');
                eventEntry.className = 'timeline-entry';

                eventEntry.innerHTML = `
                <span>
                    <strong>${event.minute} | ${event.type}:<strong>${event.description} <em>(${teamName})</em>
                </span>`;

               timelineContainer.appendChild(eventEntry); 
            })
        }

        /**
         * log the event entry locally and update timeline
         */
        function logEvent(){
            const selectType = document.getElementById('event-type');
            const typeVal = selectType.value;
            const selectTeam = document.getElementById('event-team');
            const teamVal = selectTeam.value;
            const inputMinute = document.getElementById('event-minute');
            const inputDesc = document.getElementById('event-desc');

            const eventMinute = parseInt(inputMinute.value, 10);
            const eventDesc = inputDesc.value.trim();

            const newEvent = {
                minute: eventMinute,
                type: typeVal,
                description: eventDesc,
                team: teamVal,
                timestamp: new Date().toISOString()
            };

            matchEvents.push(newEvent);

            loadTimeline();

            inputDesc.value = '';
            inputMinute.value = eventMinute +1;
            //inputDesc.focus();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('logEventButton').addEventListener('click', (e) => {

        /**
         * Show LIVE badge if match is in progress or END badge if match is final
         * @param match match id
         */
        function updateLiveBadgeDisplay(match) {
            const badge = document.getElementById("liveBadge");

            if (match.matchStatus === "In Progress") {
                badge.classList.remove("ended");
                badge.classList.add("live");
                badge.style.display = "inline-flex";
                badge.innerHTML = `<span class="live-dot"></span> LIVE`;
            } else if (match.matchStatus === "Final") {
                badge.classList.remove("live");
                badge.classList.add("ended");
                badge.style.display = "inline-block";
                badge.textContent = "ENDED";
            } else {
                badge.classList.remove("live");
                badge.classList.remove("ended");
                badge.classList.add("offline");
                badge.style.display = "inline-block";
                badge.textContent = "OFFLINE";
            }
        }

        /**

            } else {
                chatInput.classList.add("chat-hidden");
            }
        }

    <!-- Reaction Bar -->
    <script>
        /**
         * Load all reactions for a match.
         * @param match object
         */
        async function loadReactions(match) {
            const userRes = await fetch('/loggedUser');
            const user = await userRes.json();

            let reactionTypes = ["happy", "neutral", "sad", "angry", "like", "dislike"];
            for (let i = 0; i < reactionTypes.length; i++) {
                const type = reactionTypes[i];
                updateReactionCounter(match, type);
                showActiveReaction(match, type, user);
            }

            // Make reaction bar clickable only when match is "In Progress"
            const reactionBar = document.getElementById("reactionBar");
            if (match.matchStatus !== "In Progress") {
                reactionBar.classList.add("match-disabled");
            } else {
                reactionBar.classList.remove("match-disabled");
            }
        }

        /**
         * Update each match reaction's counter.
         * @param match object
         * @param type what reaction (noted from the html)
         */
        async function updateReactionCounter(match, type) {
            const counter = document.querySelector(`[data-count-${type}]`);
            if (counter && match.reactions && match.reactions[type]) {
                counter.innerText = match.reactions[type].length;
            }
        }

        /**
         * Show user's active/clicked reactions as bold/highlighted.
         * @param match object
         * @param type what reaction
         * @param user currently logged in
         */
        async function showActiveReaction(match, type, user) {
            if (user && match.reactions && match.reactions[type]) {
                const hasReacted = match.reactions[type].includes(user._id);

                if (hasReacted) {
                    const btn = document.querySelector(`.reaction-card[data-reaction="${type}"]`);
                    // Apply the highlight CSS to the button
                    if (btn) {
                        btn.classList.add("active");
                    }
                }
            }
        }

        /**
         * Update the reaction bar visibility by hiding it if guest or show it if logged in.
         */
        async function updateReactionVisibility() {
            let res = await fetch('/loggedUser');
            let user = await res.json();
            const bar = document.getElementById('reactionBar');

            if (!user) {
                bar.classList.add('guest-disabled');
            } else {
                bar.classList.remove('guest-disabled');
            }
        }

        /**
        * Attach match reaction handler backend to each reaction button. 
        */
        function attachReactionHandler() {
            let reactionBtns = document.getElementsByClassName("reaction-card");

            for (let btn of reactionBtns) {
                btn.addEventListener("click", async function () {
                    const reaction = btn.getAttribute("data-reaction");
                    const urlParams = new URLSearchParams(window.location.search);
                    const matchId = urlParams.get('id');

                    const response = await fetch(`/updateMatchReaction/${matchId}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ reaction })
                    });
                    const result = await response.json();
                    updateReactionButtonDisplay(btn, result);
                });
            }
        }

        /**
         * Update the UI for a reaction button.
         * @param btn reaction button element
         * @param result response data
         */
        function updateReactionButtonDisplay(btn, result) {
            let counter = btn.querySelector(".reaction-count");
            counter.innerText = result.count;
            if (result.isReacted) {
                // Counter increments
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        }

    </script>


    <!-- Live Match Chat-->
    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id');
        const socket = window.socket;
        const messages = document.getElementById('chatMessages');
        const input = document.getElementById('chatInputText');
        const sendBtn = document.getElementById('sendBtn');

        /**
         * socket.io connection message
         */
        socket.on('connect', () => {
            console.log('Connected to Socket.IO server!');
        });

        // Get user's name or a random Guest name for guest users
        let response = await fetch('/loggedUser');
        let user = await response.json();
        let guestName = 'Guest' + (Math.floor(Math.random() * 1000) + 1);
        let name = user ? user.username : guestName;

        /**
         * Format the date string so that it shows relative timestamps.
         */
        function formatTime(dateString) {
            const now = new Date();
            const then = new Date(dateString);

            let seconds = Math.floor((now - then) / 1000);
            if (seconds < 60) {
                return `${seconds} seconds ago`;
            }

            let minutes = Math.floor(seconds / 60);
            if (minutes < 60) {
                return `${minutes} minutes ago`;
            }

            let hours = Math.floor(minutes / 60);
            if (hours < 24) {
                return `${hours} hours ago`;
            }

            let days = Math.floor(hours / 24);
            return `${days} days ago`;
        }

        /**
         * Load all saved messages for a live match and create HTML element for it to display.
         */
        async function loadMessages() {
            let response = await fetch(`/getMessagesByMatch/${matchId}`);
            let data = await response.json();
            messages.innerHTML = "";

            for (let i = 0; i < data.length; i++) {
                const msg = data[i];
                const div = document.createElement('div');
                div.classList.add('chat-message');

                // Timestamp and role (admin, manager) tag
                const time = formatTime(msg.uploadedAt);
                const roleTag = createRoleTag(msg);

                const displayName =
                    (msg.user_id && msg.user_id.username) ||
                    msg.username;

                div.innerHTML = `
                <span class="chat-time">${time}</span> 
                <strong class="chat-name">${roleTag} ${displayName}</strong>: ${msg.text}`;

                messages.appendChild(div);
            }
            messages.scrollTop = messages.scrollHeight;
        }

        /**
         * Create a HTML code for the role tag (admin and manager only).
         * @param msg message id
         * @returns role tag HTML 
         */
        function createRoleTag(msg) {
            const roleClass = msg.role ? `role-${msg.role}` : "";
            const roleTag = msg.role && msg.role !== "guest" && msg.role !== "adult"
                ? `<span class="role-tag ${roleClass}">${msg.role.toUpperCase()}</span>`
                : "";
            return roleTag;
        }

        /**
         * Add a new message to the current HTML div for live chat.
         */
        socket.on('message', (data) => {
            console.log('Received message:', data);
            const div = document.createElement('div');
            const time = formatTime(new Date());
            const roleTag = createRoleTag(data);

            div.classList.add('chat-message');
            div.innerHTML = `
            <span class="chat-time">${time}</span> 
            <strong class="chat-name">${roleTag} ${data.username}</strong>: ${data.text}
            `;

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        });

        /**
         * Send and save the new message to database.
         */
        sendBtn.addEventListener('click', async () => {
            // Ignore empty input
            if (!input.value.trim()) {
                return;
            }
            let text = input.value;

            await fetch('/createMessage', {
                method: 'POST',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    match_id: matchId,
                    user_id: user ? user._id : null,
                    username: name,
                    text: text,
                    role: user ? user.role : "guest"
                })
            });

            // Send message to the server also
            socket.emit('message', {
                username: name,
                text: text,
                matchId: matchId,
                role: user ? user.role : "guest"
            });
            input.value = '';
        });

        /**
        * Allow the Enter key to be used for sending message also
        */
        input.addEventListener("keypress", async (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                sendBtn.click();
            }
        });
        loadMessages();
    </script>



<script type="module">
    import { startStopClock, resetClock, initClock } from "/Clock/Clock.js";


    async function setupTimerUI() {

        const userRes = await fetch('/loggedUser');
        const user = await userRes.json();

        const isAdmin = user && user.role === "admin";
        const adminControls = document.getElementById("adminTimerControls");

        // Only admins see the timer buttons
        if (isAdmin) {
            adminControls.style.display = "block";

            document.getElementById("startStopClockBtn").addEventListener("click", () => {
                startStopClock();
            });

            document.getElementById("resetClockBtn").addEventListener("click", () => {
                resetClock();
            });
        }
    }


    // clock socket events.
    window.socket.on("clock:start", data => {
        console.log("Clock start received", data);
    });

    window.socket.on("clock:stop", data => {
        console.log("Clock stop received", data);
    });

    window.socket.on("clock:reset", data => {
        console.log("Clock reset received", data);
    });

    // Initialize
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id');
        initClock(matchId);
        setupTimerUI();
    });
</script>
