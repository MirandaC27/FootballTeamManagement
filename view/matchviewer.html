<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <title>Match View</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!--nav bar-->
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <nav class="navbar navbar-dark bg-primary">

            <!--logo-->
            <a class="navbar-brand" href="/index.html">
                <img src="/images/logo placeholder.jpg" width="30" height="30" class="d-inline-block align-top" alt="">
                littleLIGA
            </a>
        </nav>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!--options-->
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-item nav-link" href="/index.html">Home <span class="sr-only">(current)</span></a>
                <a class="nav-item nav-link" href="#">League</a>
                <a class="nav-item nav-link" href="/match.html">Matches</a>
                <a class="nav-item nav-link" href="#">Team</a>
                <a class="nav-item nav-link" href="/calendar.html">Calendar</a>
            </div>
        </div>

        <!--sign in button-->
        <div id="signin-btn" class="ms-auto">
            <a class="btn btn-dark btn-rounded" href="/login.html">SIGN IN</a>
        </div>

        <!--account and log out dropdown-->
        <div id="account-dropdown" class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person"
                    viewBox="0 0 16 16">
                    <path
                        d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                </svg> Account
            </button>
            <ul class="dropdown-menu">
                <li id="admin"><a class="dropdown-item" href="/admin.html">Admin</a></li>
                <li><a class="dropdown-item" href="/logout">Log out</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-nav-header">
        <button id="backButton" class="btn back-btn" type="button">
            &larr; Back to Schedule
        </button>
    </header>

    <!--container for the match-->
    <main>
        <!--<div class="section-header"><h5>Match Viewer</h5></div>-->
        <section class="viewer-container">
            <div class="viewer-header">
                <span id="matchStatus" class="match-status"></span>
                <span class="seperator">•</span>
                <span id="matchLocation"></span>
            </div>

            <div class="viewer-content">
                <div class="team-content Home">
                    <h2 id="homeTeam" class="team-name"></h2>
                </div>

                <div class="score-content">
                    <span id="homeScore" class="score-number"></span>
                    <span class="score-seperator">:</span>
                    <span id="awayScore" class="score-number"></span>
                </div>

                <div class="team-content Away">
                    <h2 id="awayTeam" class="team-name"></h2>
                </div>
            </div>

            <div class="viewer-footer">
                <div class="date-time">
                    <span id="matchDate"></span>
                    <!--<span class="seperator">•</span>-->
                    <!--<span id="match"></span>-->
                </div>
            </div>
        </section>
        <section class="details-container">
            <nav class="nav-header">Timeline</nav>
            <div class="timeline-container">
                <div class="timeline-item">
                    <span class="event-minute">15'</span>
                    <div>⚽️ **Goal** (H) - A. Johnson (Assist: B. Smith)</div>
                </div>
            </div>
        </section>
    </main>


    <!-- REACTION BAR -->
    <section id="reactionBar" class="reaction-bar guest-disabled">
        <button class="reaction-card" data-reaction="happy">
            <span class="emoji">😄</span>
            <span class="reaction-count" data-count-happy>0</span>
        </button>

        <button class="reaction-card" data-reaction="neutral">
            <span class="emoji">😐</span>
            <span class="reaction-count" data-count-neutral>0</span>
        </button>

        <button class="reaction-card" data-reaction="sad">
            <span class="emoji">😢</span>
            <span class="reaction-count" data-count-sad>0</span>
        </button>

        <button class="reaction-card" data-reaction="angry">
            <span class="emoji">😡</span>
            <span class="reaction-count" data-count-angry>0</span>
        </button>

        <button class="reaction-card" data-reaction="like">
            <span class="emoji">👍</span>
            <span class="reaction-count" data-count-like>0</span>
        </button>

        <button class="reaction-card" data-reaction="dislike">
            <span class="emoji">👎</span>
            <span class="reaction-count" data-count-dislike>0</span>
        </button>
    </section>


    <script>

        document.addEventListener('DOMContentLoaded', () => {
            // ... existing loadMatch(SAMPLE_MATCH_DATA); and setupTabListeners(); ...

            // New logic for the back button
            const backButton = document.getElementById('backButton');
            if (backButton) {
                backButton.addEventListener('click', () => {
                    // Tells the browser to go back one step in its history
                    window.history.back();
                });
            }
        });

        /**
        * Show sign in button if logged out or show account dropdown if signed in.
        */
        async function checkLoggedUser() {
            let response = await fetch('/loggedUser');
            let user = await response.json();
            const signInBtn = document.getElementById('signin-btn');
            const accountDropdown = document.getElementById('account-dropdown');

            if (user) {
                signInBtn.style.display = 'none';
                accountDropdown.style.display = 'block';

                // show admin option only if user is an admin
                if (user.role === 'admin') {
                    document.getElementById('admin').style.display = 'block';
                } else {
                    document.getElementById('admin').style.display = 'none';
                }
            } else {
                signInBtn.style.display = 'block';
                accountDropdown.style.display = 'none';
            }
        }
        checkLoggedUser();

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const matchId = urlParams.get('id');

            if (matchId) {
                loadMatch(matchId);
            }
            else {
                console.error("Error: No Match ID found in the URL.");
            }
        });

        async function loadMatch(id) {
            const res = await fetch(`/getMatchDetails/${id}`);

            if (!res.ok) {
                alert('Failed to load match details');
                return;
            }
            const match = await res.json();

            document.getElementById('homeTeam').textContent = match.homeTeam;
            document.getElementById('awayTeam').textContent = match.awayTeam;
            document.getElementById('homeScore').textContent = match.homeScore;
            document.getElementById('awayScore').textContent = match.awayScore;
            document.getElementById('matchDate').textContent = match.matchDate.split('T')[0];
            document.getElementById('matchLocation').textContent = match.matchLocation;
            document.getElementById('matchStatus').textContent = match.matchStatus;

            loadReactions(match);
        }

    </script>


    <!-- REACTION BAR SCRIPT -->
    <script>
        /**
         * Load all reactions for a match.
         * @param match object
         */
        async function loadReactions(match) {
            const userRes = await fetch('/loggedUser');
            const user = await userRes.json();

            let reactionTypes = ["happy", "neutral", "sad", "angry", "like", "dislike"];
            for (let i = 0; i < reactionTypes.length; i++) {
                const type = reactionTypes[i];
                updateReactionCounter(match, type);
                showActiveReaction(match, type, user);
            }

            // Make reaction bar clickable only when match is "In Progress"
            const reactionBar = document.getElementById("reactionBar");
            if (match.matchStatus !== "In Progress") {
                reactionBar.classList.add("match-disabled");
            } else {
                reactionBar.classList.remove("match-disabled");
            }
        }

        /**
         * Update each match reaction's counter.
         * @param match object
         * @param type what reaction (noted from the html)
         */
        async function updateReactionCounter(match, type) {
            const counter = document.querySelector(`[data-count-${type}]`);
            if (counter && match.reactions && match.reactions[type]) {
                counter.innerText = match.reactions[type].length;
            }
        }

        /**
         * Show user's active/clicked reactions as bold/highlighted.
         * @param match object
         * @param type what reaction
         * @param user currently logged in
         */
        async function showActiveReaction(match, type, user) {
            if (user && match.reactions && match.reactions[type]) {
                const hasReacted = match.reactions[type].includes(user._id);
                if (hasReacted) {
                    const btn = document.querySelector(`.reaction-card[data-reaction="${type}"]`);
                    // Apply the highlight CSS to the button
                    if (btn) {
                        btn.classList.add("active");
                    }
                }
            }
        }

        /**
         * Update the reaction bar visibility by hiding it if guest or show it if logged in.
         */
        async function updateReactionVisibility() {
            let res = await fetch('/loggedUser');
            let user = await res.json();
            const bar = document.getElementById('reactionBar');

            if (!user) {
                bar.classList.add('guest-disabled');
            } else {
                bar.classList.remove('guest-disabled');
            }
        }

        /**
        * Attach match reaction handler backend to each reaction button. 
        */
        function attachReactionHandler() {
            let reactionBtns = document.getElementsByClassName("reaction-card");

            for (let btn of reactionBtns) {
                btn.addEventListener("click", async function () {
                    const reaction = btn.getAttribute("data-reaction");
                    const urlParams = new URLSearchParams(window.location.search);
                    const matchId = urlParams.get('id');
                    const response = await fetch(`/updateMatchReaction/${matchId}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ reaction })
                    });
                    const result = await response.json();
                    updateReactionButtonDisplay(btn, result);
                });
            }
        }

        /**
         * Update the UI for a reaction button.
         * @param btn reaction button element
         * @param result response data
         */
        function updateReactionButtonDisplay(btn, result) {
            let counter = btn.querySelector(".reaction-count");
            counter.innerText = result.count;
            if (result.isReacted) {
                // Counter increments
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        }
        updateReactionVisibility();
        attachReactionHandler();
    </script>


</body>

</html>
